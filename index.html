<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amber Hanson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --blue: #1a3a5c;
    --red: #8b1a1a;
    --white: #ffffff;
    --black: #0a0a0a;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--white);
    color: var(--black);
    font-family: 'Lora', serif;
    overflow: hidden;
  }

  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 1.5rem 2rem;
  }

  .nav-name {
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--black);
    text-decoration: none;
    opacity: 0.9;
  }

  .nav-links {
    display: flex;
    gap: 2rem;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .nav-links a {
    color: var(--black);
    text-decoration: none;
    opacity: 0.45;
    transition: opacity 0.2s;
  }

  .nav-links a:hover { opacity: 1; }
  .nav-links a.active { opacity: 1; color: var(--blue); }

  .strip-wrap {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    cursor: grab;
    padding: 0 2rem;
  }

  .strip-wrap::-webkit-scrollbar { display: none; }
  .strip-wrap.dragging { cursor: grabbing; }

  .strip-inner {
    display: flex;
    gap: 1.25rem;
    align-items: center;
    padding: 4rem 0 3rem;
    flex-shrink: 0;
  }

  .strip-inner img {
    height: 62vh;
    width: auto;
    display: block;
    flex-shrink: 0;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  .counter {
    position: fixed;
    bottom: 1.75rem;
    right: 2rem;
    z-index: 100;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--black);
    opacity: 0.4;
  }

  .scroll-hint {
    position: fixed;
    bottom: 1.75rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--black);
    opacity: 0.3;
    transition: opacity 1.2s ease;
    z-index: 100;
  }

  .scroll-hint.hidden { opacity: 0; }
</style>
</head>
<body>

<nav>
  <a class="nav-name" href="index.html">Amber Hanson</a>
  <div class="nav-links">
    <a href="index.html" class="active">static</a>
    <a href="dynamic.html">dynamic</a>
    <a href="information.html">information</a>
  </div>
</nav>

<div class="strip-wrap" id="strip">
  <div class="strip-inner" id="stripInner"></div>
</div>

<div class="counter" id="counter">01 / 13</div>
<div class="scroll-hint" id="hint">← scroll →</div>

<script>
  const images = [
    'Static/893DDB42-164A-431A-A4D8-EFC5BDE7372F.jpg',
    'Static/MindBlock 2.png',
    'Static/Mindblock 2.2.png',
    'Static/Mindblock 2.3.png',
    'Static/cone 2.png',
    'Static/cone1.png',
    'Static/flatconreteblue.png',
    'Static/flatprojection.png',
    'Static/grey stencil.jpg',
    'Static/mindblock 1.2.png',
    'Static/mindblock 1.png',
    'Static/red rain.png',
    'Static/steps.png',
  ];

  const strip = document.getElementById('strip');
  const inner = document.getElementById('stripInner');
  const counter = document.getElementById('counter');
  const hint = document.getElementById('hint');

  images.forEach((src, i) => {
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    img.loading = i < 4 ? 'eager' : 'lazy';
    inner.appendChild(img);
  });

  function updateCounter() {
    const sw = strip.scrollWidth - strip.clientWidth;
    const pct = sw > 0 ? strip.scrollLeft / sw : 0;
    const idx = Math.min(Math.round(pct * (images.length - 1)) + 1, images.length);
    counter.textContent = String(idx).padStart(2, '0') + ' / ' + images.length;
  }

  strip.addEventListener('scroll', updateCounter, { passive: true });

  // Fade hint after first scroll or 3s
  let hintGone = false;
  function hideHint() {
    if (hintGone) return;
    hintGone = true;
    hint.classList.add('hidden');
  }
  strip.addEventListener('scroll', hideHint, { once: true });
  setTimeout(hideHint, 3000);

  // Click-drag to scroll
  let dragging = false;
  let startX, startScroll;

  strip.addEventListener('mousedown', e => {
    dragging = true;
    strip.classList.add('dragging');
    startX = e.clientX;
    startScroll = strip.scrollLeft;
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    strip.scrollLeft = startScroll - (e.clientX - startX);
  });

  document.addEventListener('mouseup', () => {
    dragging = false;
    strip.classList.remove('dragging');
  });

  // Arrow key navigation
  document.addEventListener('keydown', e => {
    if (e.code === 'ArrowRight') strip.scrollBy({ left: 300, behavior: 'smooth' });
    if (e.code === 'ArrowLeft')  strip.scrollBy({ left: -300, behavior: 'smooth' });
  });
</script>
</body>
</html>
